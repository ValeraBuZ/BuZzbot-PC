name: BuZzbot Portable Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v

      - name: Собрать portable-версию
        shell: pwsh
        run: |
          Copy-Item config.example.json config.json
          python tools/install_training_profile.py `
            --profile profiles/BuZzbot_PC_1280x720.zip `
            --install-root .
          python build_portable.py --clean-runtime
          Remove-Item dist/BuZzbotPortable.zip -Force
          Compress-Archive `
            -Path dist/BuZzbotPortable `
            -DestinationPath dist/BuZzbotPortable.zip `
            -CompressionLevel Optimal
          $version = python -c "from buzzbot.version import APP_VERSION; print(APP_VERSION)"
          $sha256 = (Get-FileHash dist/BuZzbotPortable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            version = $version.Trim()
            sha256 = $sha256
            archive = "BuZzbotPortable.zip"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content dist/update-manifest.json -Encoding utf8NoBOM

      - name: Проверить portable-сборку
        shell: pwsh
        run: |
          $exe = Get-Item dist/BuZzbotPortable/BuZzbot.exe
          $archive = Get-Item dist/BuZzbotPortable.zip
          $config = Get-Content dist/BuZzbotPortable/config.json -Raw | ConvertFrom-Json
          $manifest = Get-Content dist/update-manifest.json -Raw | ConvertFrom-Json
          $templates = @(Get-ChildItem dist/BuZzbotPortable/img -Filter *.png -Recurse)
          $actualSha256 = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($exe.Length -lt 1MB) { throw 'BuZzbot.exe повреждён или отсутствует.' }
          if ($archive.Length -lt 10MB) { throw 'Portable ZIP повреждён или отсутствует.' }
          if (@($config.images).Count -eq 0) { throw 'В portable-конфигурации нет шаблонов.' }
          if ($templates.Count -lt @($config.images).Count) { throw 'В portable-сборке не хватает PNG-шаблонов.' }
          if ($manifest.sha256 -ne $actualSha256) { throw 'Контрольная сумма ZIP не совпадает.' }
      - name: Сохранить ZIP сборки
        uses: actions/upload-artifact@v4
        with:
          name: BuZzbotPortable
          path: |
            dist/BuZzbotPortable.zip
            dist/update-manifest.json
          if-no-files-found: error

      - name: Обновить релиз latest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view latest --json assets --jq '.assets[].name'
            foreach ($asset in $assets) {
              if ($asset -notin @('BuZzbotPortable.zip', 'update-manifest.json')) {
                gh release delete-asset latest $asset --yes
              }
            }
            gh release upload latest dist/BuZzbotPortable.zip dist/update-manifest.json --clobber
            gh release edit latest --title "BuZzbot — последняя portable-сборка" --notes "Автоматическая сборка BuZzbot из ветки main."
          } else {
            gh release create latest dist/BuZzbotPortable.zip dist/update-manifest.json --title "BuZzbot — последняя portable-сборка" --notes "Автоматическая сборка BuZzbot из ветки main."
          }
